[project]
name = "airflow-site-archive"
version = "0.1.0"
description = "Airflow site archive for old/versioned docs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.38.11",
    "rich>=14.0.0",
]

[tool.ruff.lint]
# These scripts deliberately catch broad exceptions to print a readable message
# and exit, rather than dumping a traceback on a user running them by hand.
ignore = ["BLE001"]
