<html><head><meta http-equiv="refresh" content="0; url=../administration-and-deployment/logging-monitoring/tracking-user-activity.html"/></head></html>
<script>/* airflow-site-archive: theme toggle (CSP-safe) */
(() => {
  const html = document.documentElement;
  const btn = document.getElementById('bd-theme');
  const menu = document.querySelector('.navbar__theme-toggle .dropdown-menu');
  if (!btn || !menu) return;

  // Ensure menu is labelled by the button (a11y)
  if (!menu.getAttribute('aria-labelledby')) menu.setAttribute('aria-labelledby', 'bd-theme');

  const getStored = () => localStorage.getItem('theme');
  const setStored = (t) => localStorage.setItem('theme', t);
  const prefersDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const resolveTheme = (t) => (t === 'auto' ? (prefersDark() ? 'dark' : 'light') : t);

  const applyTheme = (choice) => {
    const resolved = resolveTheme(choice);
    html.setAttribute('data-bs-theme', resolved);
    for (const b of menu.querySelectorAll('[data-bs-theme-value]')) {
      const v = b.getAttribute('data-bs-theme-value');
      const active = v === choice;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    }
    const activeIconUse = btn.querySelector('.theme-icon-active use');
    if (activeIconUse) {
      const iconMap = { light: '#sun-fill', dark: '#moon-stars-fill', auto: '#circle-half' };
      activeIconUse.setAttribute('href', iconMap[choice] || '#circle-half');
    }
  };

  const openMenu = () => { menu.classList.add('show'); btn.setAttribute('aria-expanded', 'true'); };
  const closeMenu = () => { menu.classList.remove('show'); btn.setAttribute('aria-expanded', 'false'); };
  const toggleMenu = () => (menu.classList.contains('show') ? closeMenu() : openMenu());

  btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleMenu(); });
  document.addEventListener('click', (e) => {
    if (!menu.classList.contains('show')) return;
    if (e.target && (btn.contains(e.target) || menu.contains(e.target))) return;
    closeMenu();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  for (const item of menu.querySelectorAll('[data-bs-theme-value]')) {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      const choice = item.getAttribute('data-bs-theme-value') || 'auto';
      setStored(choice);
      applyTheme(choice);
      closeMenu();
    });
  }

  const initialChoice = getStored() || 'auto';
  applyTheme(initialChoice);

  if (window.matchMedia) {
    const mql = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if ((getStored() || 'auto') === 'auto') applyTheme('auto'); };
    if (mql.addEventListener) mql.addEventListener('change', onChange);
    else if (mql.addListener) mql.addListener(onChange);
  }
})();
</script>
