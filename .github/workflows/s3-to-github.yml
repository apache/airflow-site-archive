---
name: Sync S3 to GitHub
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      source:
        description: "The source location in S3"
        required: true
        type: choice
        options:
          - live
          - staging
        default: live
      document-packages:
        description: "Document packages - long or short seprated by spaces"
        required: false
        default: "all"
        type: string
      commit-changes:
        description: "Commit changes to GitHub"
        required: false
        default: true
        type: boolean
      sync-registry:
        description: "Sync registry files from S3"
        required: false
        default: true
        type: boolean
      sync-back-references:
        description: "Sync generated back-references to S3"
        required: false
        default: true
        type: boolean
      processes:
        description: "Number of processes to use for syncing"
        required: false
        default: "4"
        type: string
permissions:
  contents: read
concurrency:
  group: s3-to-github-${{ github.ref }}-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  s3-to-github:  # zizmor: ignore[secrets-outside-env]
    name: S3 to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push synced docs back to main/staging branches
    env:
      SOURCE: ${{ inputs.source }}
      DOCUMENT_PACKAGES: ${{ inputs.document-packages }}
      COMMIT_CHANGES: ${{ inputs.commit-changes }}
      PROCESSES: ${{ inputs.processes }}
      AIRFLOW_SITE_DIRECTORY:  /mnt/cloned-airflow-site-archive

    steps:
      - name: Summarize parameters
        id: parameters
        run: |
          echo "Input parameters summary"
          echo "========================="
          echo "Source: ${SOURCE}"
          echo "Document packages: ${DOCUMENT_PACKAGES}"
          echo "Commit changes: ${COMMIT_CHANGES}"
          echo "Processes: ${PROCESSES}"
          if [[ "${SOURCE}"  == "live" ]]; then
             echo "source-location=s3://live-docs-airflow-apache-org/docs/" >> ${GITHUB_OUTPUT}
             echo "registry-source-location=s3://live-docs-airflow-apache-org/registry/" >> ${GITHUB_OUTPUT}
          else
             echo "source-location=s3://staging-docs-airflow-apache-org/docs/" >> ${GITHUB_OUTPUT}
             echo "registry-source-location=s3://staging-docs-airflow-apache-org/registry/" >> ${GITHUB_OUTPUT}
          fi

      - name: "Install uv"
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          rm /tmp/awscliv2.zip
          sudo /tmp/aws/install --update
          rm -rf /tmp/aws/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.DOCS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Pre-process docs packages
        env:
          DOCUMENT_PACKAGES: ${{ inputs.document-packages }}
        id: docs-packages-processed
        run: |
          echo "sparse-checkout<<EOF" >> ${GITHUB_OUTPUT}
          echo ".github" >> ${GITHUB_OUTPUT}
          echo "scripts" >> ${GITHUB_OUTPUT}
          echo "registry-archive" >> ${GITHUB_OUTPUT}
          if [[ "${DOCUMENT_PACKAGES}" != "all" ]]; then
            echo "Preprocessing docs packages: ${DOCUMENT_PACKAGES}"
            packages=""
            sparse_checkout=""
            separator=""
            for package in ${DOCUMENT_PACKAGES}; do
              if [[ "${package}" != apache-airflow-providers* && "${package}" != "apache-airflow" \
                 && "${package}" != "docker-stack" && "${package}" != "helm-chart" ]]; then
                packages="${packages}${separator}apache-airflow-providers-${package/./-}"
                echo "docs-archive/apache-airflow-providers-${package/./-}" >> ${GITHUB_OUTPUT}
              else
                packages="${packages}${separator}${package}"
                echo "docs-archive/${package}" >> ${GITHUB_OUTPUT}
              fi
              separator=" "
            done
          else
            packages="all"
            echo "docs-archive" >> ${GITHUB_OUTPUT}
          fi
          echo "EOF" >> ${GITHUB_OUTPUT}
          echo "docs-packages-processed=${packages}"
          echo "docs-packages-processed=${packages}" >> ${GITHUB_OUTPUT}

      - name: Create /mnt/cloned-airflow-site-archive directory
        run: |
          sudo mkdir -pv /mnt/cloned-airflow-site-archive && sudo chown -R "${USER}" /mnt/cloned-airflow-site-archive
          ln -sv /mnt/cloned-airflow-site-archive cloned-airflow-site-archive

      - name: >
          Checkout (${{  inputs.commit-sha || github.sha }}) to /mnt/cloned-airflow-site-archive
          with docs: ${{ steps.docs-packages-processed.outputs.docs-packages-processed }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ./cloned-airflow-site-archive
          fetch-depth: 1
          sparse-checkout: |
            ${{ steps.docs-packages-processed.outputs.sparse-checkout }}
          persist-credentials: true
        if: steps.docs-packages-processed.outputs.docs-packages-processed != 'all'

      - name: >
          Checkout (${{  inputs.commit-sha || github.sha }}) to /mnt/cloned-airflow-site-archive (whole repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ./cloned-airflow-site-archive
          fetch-depth: 1
          persist-credentials: true
        if: steps.docs-packages-processed.outputs.docs-packages-processed == 'all'

      - name: "Check space available"
        run: df -h

      - name: Syncing ${{ inputs.source }} (${{ inputs.document-packages }})
        env:
          PROCESSES: ${{ inputs.processes }}
          DOCUMENT_PACKAGES: ${{ inputs.document-packages }}
          SOURCE_LOCATION: ${{ steps.parameters.outputs.source-location }}
        run: |
          set -x
          aws configure set default.s3.max_concurrent_requests 10
          uv run ./scripts/s3_to_github.py \
            --bucket-path ${SOURCE_LOCATION} \
            --local-path ./docs-archive \
            --document-packages "${DOCUMENT_PACKAGES}" \
            --processes "${PROCESSES}"
        working-directory: /mnt/cloned-airflow-site-archive

      - name: Syncing registry from ${{ inputs.source }}
        env:
          REGISTRY_SOURCE_LOCATION: ${{ steps.parameters.outputs.registry-source-location }}
        run: |
          set -x
          aws s3 sync "${REGISTRY_SOURCE_LOCATION}" ./registry-archive/ --delete
        working-directory: /mnt/cloned-airflow-site-archive
        if: inputs.sync-registry == true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Checkout airflow to run breeze
        with:
          repository: 'apache/airflow'
          path: airflow
          fetch-depth: 1
          persist-credentials: false

      - name: "Install breeze"
        run: uv tool install -e ./dev/breeze
        working-directory: airflow

      - name: "Generate back references for providers"
        run: breeze release-management add-back-references all-providers
        working-directory: airflow

      - name: "Generate back references for apache-airflow"
        run: breeze release-management add-back-references apache-airflow
        working-directory: airflow

      - name: "Generate back references for docker-stack"
        run: breeze release-management add-back-references docker-stack
        working-directory: airflow

      - name: "Generate back references for helm-chart"
        run: breeze release-management add-back-references helm-chart
        working-directory: airflow

      - name: Show files that will be committed
        run : git add --dry-run .
        working-directory: /mnt/cloned-airflow-site-archive

      - name: Syncing back-reference changes to ${{ inputs.source }} (${{ inputs.document-packages }})
        env:
          PROCESSES: ${{ inputs.processes }}
          DOCUMENT_PACKAGES: ${{ inputs.document-packages }}
          SOURCE_LOCATION: ${{ steps.parameters.outputs.source-location }}
        run: |
          set -x
          aws configure set default.s3.max_concurrent_requests 10
          uv run ./scripts/github_to_s3.py \
            --bucket-path ${SOURCE_LOCATION} \
            --local-path /mnt/cloned-airflow-site-archive/docs-archive \
            --document-packages "${DOCUMENTS_PACKAGES}" \
            --commit-ref "main" --sync-type full-sync --skip-delete \
            --processes ${PROCESSES}
        working-directory: /mnt/cloned-airflow-site-archive
        if: >
          inputs.sync-back-references == true && (
             github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
          ) && inputs.commit-changes == true


      - name: Committing live changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running git config"
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          echo "Running git add"
          git add --verbose .
          echo "Running git commit"
          git commit -m "Sync S3 to GitHub" || echo -e "\e[32mNo changes to commit\e[0m"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
        working-directory: /mnt/cloned-airflow-site-archive
        if: inputs.commit-changes == true && github.ref == 'refs/heads/main' && inputs.source == 'live'

      - name: Committing staging changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running git config"
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          echo "Running git add"
          git add --verbose .
          echo "Running git commit"
          git commit -m "Sync S3 to GitHub" || echo -e "\e[32mNo changes to commit\e[0m"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:staging
        working-directory: /mnt/cloned-airflow-site-archive
        if: inputs.commit-changes == true && github.ref == 'refs/heads/staging' && inputs.source == 'staging'
