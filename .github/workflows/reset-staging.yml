---
name: Reset staging to main

"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reset-staging-to-main
  cancel-in-progress: false
jobs:
  reset-staging:
    runs-on: ubuntu-latest
    permissions:
      # Needed to force push to staging
      contents: write
    steps:
      # The repository holds GBs of archived docs, so move the ref through the
      # API instead of cloning it.
      - name: 🚀 Force update staging to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          STAGING_SHA="$(gh api "repos/${REPOSITORY}/git/ref/heads/staging" --jq .object.sha)"
          echo "Previous staging: ${STAGING_SHA}"
          echo "New staging (main): ${MAIN_SHA}"
          {
            echo "### Reset staging to main"
            echo ""
            echo "- Previous staging: \`${STAGING_SHA}\`"
            echo "- New staging: \`${MAIN_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${MAIN_SHA}" == "${STAGING_SHA}" ]]; then
            echo "staging already points to main, nothing to update."
            exit 0
          fi
          gh api -X PATCH "repos/${REPOSITORY}/git/refs/heads/staging" \
            -f sha="${MAIN_SHA}" -F force=true
